name: SyncVela Production CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/syncvela-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/syncvela-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/syncvela-backend:buildcache,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: ${{ secrets.DOCKER_USERNAME }}/syncvela-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/syncvela-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/syncvela-frontend:buildcache,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/syncvela
            cd ~/syncvela

            curl -o docker-compose.prod.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -af